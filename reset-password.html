<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Створення нового пароля Forecast Reality Check." />
    <title>Новий пароль · Forecast Reality Check</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="runtime-config.js"></script>
    <script type="module" src="js/reset-password.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand auth-brand" href="index.html"><span class="brand__mark" aria-hidden="true">F°</span><span><strong>Forecast</strong><small>Reality Check</small></span></a>
      <p class="environment-badge" data-environment-badge aria-label="Середовище застосунку"></p>
      <section class="auth-card" aria-labelledby="reset-title">
        <p class="eyebrow">Відновлення доступу</p>
        <h1 id="reset-title">Новий пароль</h1>
        <p class="auth-intro">Введіть новий пароль щонайменше з 8 символів.</p>
        <form class="auth-form" data-reset-form novalidate>
          <label data-field><span>Новий пароль</span><span class="password-field"><input id="reset-password" type="password" name="password" autocomplete="new-password" minlength="8" required aria-invalid="false" aria-describedby="reset-password-error" /><button class="password-toggle" data-password-toggle type="button" aria-label="Показати пароль" aria-pressed="false"><svg class="password-icon password-icon--show" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="password-icon password-icon--hide" aria-hidden="true" viewBox="0 0 24 24" hidden><path d="m3 3 18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17.6 17.6 0 0 1-2.1 2.8M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6a9.7 9.7 0 0 0 4.1-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span><span class="field-error" id="reset-password-error"></span></label>
          <label data-field><span>Повторіть пароль</span><span class="password-field"><input id="reset-confirmation" type="password" name="confirmation" autocomplete="new-password" minlength="8" required aria-invalid="false" aria-describedby="reset-confirmation-error" /><button class="password-toggle" data-password-toggle type="button" aria-label="Показати пароль" aria-pressed="false"><svg class="password-icon password-icon--show" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="password-icon password-icon--hide" aria-hidden="true" viewBox="0 0 24 24" hidden><path d="m3 3 18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17.6 17.6 0 0 1-2.1 2.8M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6a9.7 9.7 0 0 0 4.1-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span><span class="field-error" id="reset-confirmation-error"></span></label>
          <button class="button" data-submit type="submit">Зберегти пароль</button>
        </form>
        <div class="form-message" data-form-message role="status" aria-live="polite" hidden><span class="message-icon" aria-hidden="true"></span><span data-message-text></span><button class="message-retry" data-retry type="button" hidden>Спробувати ще раз</button></div>
        <a class="text-link" href="login.html">Повернутися до входу</a>
      </section>
    </main>
  </body>
</html>

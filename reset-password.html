<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Створення нового пароля Forecast Reality Check." />
    <title>Новий пароль · Forecast Reality Check</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="runtime-config.js"></script>
    <script type="module" src="js/reset-password.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand auth-brand" href="index.html"><span class="brand__mark" aria-hidden="true">F°</span><span><strong>Forecast</strong><small>Reality Check</small></span></a>
      <p class="environment-badge" data-environment-badge aria-label="Середовище застосунку"></p>
      <section class="auth-card" aria-labelledby="reset-title">
        <p class="eyebrow">Відновлення доступу</p>
        <h1 id="reset-title">Новий пароль</h1>
        <p class="auth-intro">Введіть новий пароль щонайменше з 8 символів.</p>
        <form class="auth-form" data-reset-form novalidate>
          <label>Новий пароль<input type="password" name="password" autocomplete="new-password" minlength="8" required /></label>
          <label>Повторіть пароль<input type="password" name="confirmation" autocomplete="new-password" minlength="8" required /></label>
          <button class="button" data-submit type="submit">Зберегти пароль</button>
        </form>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
        <a class="text-link" href="login.html">Повернутися до входу</a>
      </section>
    </main>
  </body>
</html>

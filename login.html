<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Вхід до Forecast Reality Check." />
    <title>Вхід · Forecast Reality Check</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="runtime-config.js"></script>
    <script type="module" src="js/auth-page.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand auth-brand" href="index.html" aria-label="Forecast Reality Check — головна">
        <span class="brand__mark" aria-hidden="true">F°</span>
        <span><strong>Forecast</strong><small>Reality Check</small></span>
      </a>
      <p class="environment-badge" data-environment-badge aria-label="Середовище застосунку"></p>
      <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">Особистий кабінет</p>
        <h1 id="auth-title">З поверненням</h1>
        <p class="auth-intro" data-auth-intro>Увійдіть, щоб побачити свій dashboard.</p>

        <div class="auth-tabs" role="tablist" aria-label="Авторизація">
          <button class="auth-tab auth-tab--active" type="button" role="tab" aria-selected="true" data-mode="signin">Вхід</button>
          <button class="auth-tab" type="button" role="tab" aria-selected="false" data-mode="signup">Реєстрація</button>
        </div>

        <button class="google-auth-button" data-google-sign-in type="button">
          <svg class="google-auth-button__icon" aria-hidden="true" viewBox="0 0 24 24">
            <path fill="#4285f4" d="M21.6 12.2c0-.7-.1-1.5-.2-2.2H12v4.2h5.4a4.6 4.6 0 0 1-2 3v2.7h3.4c2-1.8 2.8-4.5 2.8-7.7Z" />
            <path fill="#34a853" d="M12 22c2.7 0 5-.9 6.8-2.3l-3.4-2.6c-.9.6-2.1 1-3.4 1a6 6 0 0 1-5.6-4.2H3v2.7A10 10 0 0 0 12 22Z" />
            <path fill="#fbbc05" d="M6.4 13.9A6 6 0 0 1 6.1 12c0-.7.1-1.3.3-1.9V7.4H3A10 10 0 0 0 2 12c0 1.7.4 3.2 1 4.6l3.4-2.7Z" />
            <path fill="#ea4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.8A9.7 9.7 0 0 0 12 2a10 10 0 0 0-9 5.4l3.4 2.7A6 6 0 0 1 12 5.9Z" />
          </svg>
          <span data-google-label>Продовжити з Google</span>
        </button>

        <div class="auth-divider" aria-hidden="true"><span>або через email</span></div>

        <form class="auth-form" data-auth-form novalidate>
          <label>Email<input type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required /></label>
          <label>
            <span>Пароль</span>
            <span class="password-field">
              <input type="password" name="password" autocomplete="current-password" minlength="8" required />
              <button class="password-toggle" data-password-toggle type="button" aria-label="Показати пароль" aria-pressed="false">
                <svg class="password-icon password-icon--show" aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="password-icon password-icon--hide" aria-hidden="true" viewBox="0 0 24 24" hidden>
                  <path d="m3 3 18 18" />
                  <path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17.6 17.6 0 0 1-2.1 2.8M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6a9.7 9.7 0 0 0 4.1-.9" />
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                </svg>
              </button>
            </span>
          </label>
          <button class="button" data-submit type="submit">Увійти</button>
        </form>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
        <button class="text-link" type="button" data-forgot-password>Забули пароль?</button>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Вхід до Forecast Reality Check." />
    <title>Вхід · Forecast Reality Check</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="runtime-config.js"></script>
    <script type="module" src="js/auth-page.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand auth-brand" href="index.html" aria-label="Forecast Reality Check — головна">
        <span class="brand__mark" aria-hidden="true">F°</span>
        <span><strong>Forecast</strong><small>Reality Check</small></span>
      </a>
      <p class="environment-badge" data-environment-badge aria-label="Середовище застосунку"></p>
      <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">Особистий кабінет</p>
        <h1 id="auth-title">З поверненням</h1>
        <p class="auth-intro" data-auth-intro>Увійдіть, щоб побачити свій dashboard.</p>

        <div class="auth-tabs" role="tablist" aria-label="Авторизація">
          <button class="auth-tab auth-tab--active" type="button" role="tab" aria-selected="true" data-mode="signin">Вхід</button>
          <button class="auth-tab" type="button" role="tab" aria-selected="false" data-mode="signup">Реєстрація</button>
        </div>

        <form class="auth-form" data-auth-form novalidate>
          <label>Email<input type="email" name="email" autocomplete="email" required /></label>
          <label>Пароль<input type="password" name="password" autocomplete="current-password" minlength="8" required /></label>
          <button class="button" data-submit type="submit">Увійти</button>
        </form>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
        <button class="text-link" type="button" data-forgot-password>Забули пароль?</button>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Вхід до Forecast Reality Check." />
    <title>Вхід · Forecast Reality Check</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="runtime-config.js"></script>
    <script type="module" src="js/auth-page.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand auth-brand" href="index.html" aria-label="Forecast Reality Check — головна">
        <span class="brand__mark" aria-hidden="true">F°</span>
        <span><strong>Forecast</strong><small>Reality Check</small></span>
      </a>
      <p class="environment-badge" data-environment-badge aria-label="Середовище застосунку"></p>
      <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">Особистий кабінет</p>
        <h1 id="auth-title">З поверненням</h1>
        <p class="auth-intro" data-auth-intro>Увійдіть, щоб побачити свій dashboard.</p>

        <div class="auth-tabs" role="tablist" aria-label="Авторизація">
          <button class="auth-tab auth-tab--active" type="button" role="tab" aria-selected="true" data-mode="signin">Вхід</button>
          <button class="auth-tab" type="button" role="tab" aria-selected="false" data-mode="signup">Реєстрація</button>
        </div>

        <form class="auth-form" data-auth-form novalidate>
          <label data-field>Email<input id="auth-email" type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required aria-invalid="false" aria-describedby="auth-email-error" /><span class="field-error" id="auth-email-error"></span></label>
          <label data-field>
            <span>Пароль</span>
            <span class="password-field">
              <input id="auth-password" type="password" name="password" autocomplete="current-password" minlength="8" required aria-invalid="false" aria-describedby="auth-password-error" />
              <button class="password-toggle" data-password-toggle type="button" aria-label="Показати пароль" aria-pressed="false">
                <svg class="password-icon password-icon--show" aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="password-icon password-icon--hide" aria-hidden="true" viewBox="0 0 24 24" hidden>
                  <path d="m3 3 18 18" />
                  <path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17.6 17.6 0 0 1-2.1 2.8M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6a9.7 9.7 0 0 0 4.1-.9" />
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                </svg>
              </button>
            </span>
            <span class="field-error" id="auth-password-error"></span>
          </label>
          <button class="button" data-submit type="submit">Увійти</button>
        </form>
        <div class="form-message" data-form-message role="status" aria-live="polite" hidden><span class="message-icon" aria-hidden="true"></span><span data-message-text></span><button class="message-retry" data-retry type="button" hidden>Спробувати ще раз</button></div>
        <button class="text-link" type="button" data-forgot-password>Забули пароль?</button>

        <section class="signup-confirmation" data-signup-confirmation aria-labelledby="signup-confirmation-title" tabindex="-1" hidden>
          <span class="signup-confirmation__icon" aria-hidden="true">✓</span>
          <h2 id="signup-confirmation-title">Перевірте вашу пошту</h2>
          <p>Ми надіслали лист для підтвердження на адресу:</p>
          <output class="signup-confirmation__email" data-signup-email></output>
          <p class="signup-confirmation__hint"><strong>Не бачите листа?</strong> Перевірте папки <strong>Inbox</strong> і <strong>Spam</strong>. Доставка може зайняти кілька хвилин.</p>
          <button class="text-link" type="button" data-change-signup-email>Вказати іншу email-адресу</button>
        </section>
      </section>
    </main>
  </body>
</html>

name: Agent issue contract
on:
  issues:
    types: [labeled, edited]
permissions:
  contents: read
  issues: write
jobs:
  validate:
    if: github.event.action == 'edited' || github.event.label.name == 'agent:validate' || github.event.label.name == 'agent:ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const issue = context.payload.issue;
            const body = String(issue.body || '').replace(/\r\n/g, '\n').trim();
            const required = ['Goal','Context','In scope','Out of scope','Acceptance criteria','Allowed paths','Required checks','Security constraints','Dependencies','Rollback','Runtime permission matrix'];
            const substantive = (value) => String(value || '').replace(/<!--[\s\S]*?-->/g, '').replace(/_No response_/gi, '').trim().length > 0;
            const complete = (heading) => { const match = body.match(new RegExp(`(?:^|\\n)### ${heading}[^\\n]*\\n([\\s\\S]*?)(?=\\n### |$)`, 'i')); return Boolean(match && substantive(match[1])); };
            const removeReady = async () => { try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: 'agent:ready' }); } catch (e) { if (e.status !== 404) throw e; } };
            const removeValidate = async () => { try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: 'agent:validate' }); } catch (e) { if (e.status !== 404) throw e; } };
            const labels = (await github.rest.issues.listLabelsOnIssue({ ...context.repo, issue_number: issue.number })).data.map((x) => x.name);
            if (context.payload.action === 'edited') { await removeReady(); if (labels.includes('agent:validate')) await removeValidate(); }
            if (context.payload.action === 'edited' && !labels.includes('agent:validate')) return;
            if (context.payload.label?.name === 'agent:ready' && context.payload.sender?.type !== 'Bot') { await removeReady(); core.setFailed('agent:ready is workflow-owned'); return; }
            const missing = required.filter((h) => !complete(h));
            if (!missing.includes('Allowed paths') && !/`[^`]+`/.test(body.match(/(?:^|\n)### Allowed paths[^\n]*\n([\s\S]*?)(?=\n### |$)/i)?.[1] || '')) missing.push('Allowed paths must use backtick syntax');
            const checkSection = body.match(/(?:^|\n)### Required checks[^\n]*\n([\s\S]*?)(?=\n### |$)/i)?.[1] || '';
            const expectedChecks = ['npm run test:bridge', 'npm run check', 'git diff --check'];
            const checks = [...checkSection.matchAll(/`([^`]+)`/g)].map((m) => m[1]);
            if (!missing.includes('Required checks') && (checks.length !== expectedChecks.length || expectedChecks.some((check) => !checks.includes(check)))) missing.push('Required checks must be exactly the approved commands');
            if (missing.length) { await removeReady(); core.setFailed(`Incomplete agent contract: ${missing.join(', ')}`); return; }
            const digest = crypto.createHash('sha256').update(body, 'utf8').digest('hex');
            const marker = `<!-- agent-contract:v1:${digest} -->`;
            const comments = (await github.rest.issues.listComments({ ...context.repo, issue_number: issue.number, per_page: 100 })).data;
            const prior = comments.filter((c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith('<!-- agent-contract:v1:'));
            for (const comment of prior) if (comment.body !== marker) await github.rest.issues.updateComment({ ...context.repo, comment_id: comment.id, body: `<!-- agent-contract:stale -->` });
            const current = prior.find((c) => c.body === marker);
            if (!current) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: marker });
            if (!labels.includes('agent:ready')) await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: ['agent:ready'] });
